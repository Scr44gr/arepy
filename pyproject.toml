[build-system]
requires = ["maturin>=1.8,<2.0"]
build-backend = "maturin"

[project]
name = "arepy"
description = "An ECS python game engine with Raylib"
authors = [{ name = "Abrahan Gil", email = "scr44gr@protonmail.com" }]
license = { file = "LICENSE" }
classifiers = [
    "License :: OSI Approved :: MIT License",
    'Development Status :: 3 - Alpha',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
    'Programming Language :: Python :: 3.14',
    'Operating System :: Microsoft :: Windows',
    'Operating System :: POSIX :: Linux',
    'Operating System :: MacOS :: MacOS X',
]
keywords = ['ecs', 'game-engine', 'python-game-engine']
requires-python = ">=3.11"
dependencies = ["bitarray==3.8.1", "raylib==5.5.0.4", "numpy>=2.2.0,<3"]
dynamic = ['version']
readme = "README.md"

[project.scripts]
arepy = "arepy.builder.cli:main"
arepy-build = "arepy.builder.cli:main"

[project.optional-dependencies]
imgui = ["imgui-bundle==1.92.700", "zengl>=2.7.2", "PyOpenGL==3.1.10"]
builder = [
    "cryptography>=45.0.0",
    "nuitka>=2.7.0",
    "ordered-set>=4.1.0",
    "zstandard>=0.23.0",
]
testing = ["cryptography>=45.0.0", "pytest>=8.0.0", "pytest-cov>=4.0.0"]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.6.0",
    "mkdocs-api-autonav>=0.4.0",
    "mkdocstrings[python]>=0.28.0",
]

[dependency-groups]
dev = [
    "maturin>=1.8.2",
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.6.0",
    "mkdocs-api-autonav>=0.4.0",
    "mkdocstrings[python]>=0.28.0",
]

[tool.maturin]
bindings = "pyo3"
manifest-path = "crates/arepy_renderer/Cargo.toml"
python-source = "."
python-packages = ["arepy"]
module-name = "arepy.arepy_renderer"
include = ["arepy/py.typed", "arepy/**/*.pyi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=arepy",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
]

[tool.coverage.run]
source = ["arepy"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
    "*/venv/*",
    "*/virtualenv/*",
    "*/engine/*",
    "*/event_manager/*",
    "*/math/*",
    "*/bundle/*",
    "*/container.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
