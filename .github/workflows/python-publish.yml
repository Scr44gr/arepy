name: Upload Python Package

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  wheels:
    name: Build ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64
            manylinux: "2014"
            artifact: wheels-linux-x86_64
          - os: ubuntu-latest
            target: aarch64
            manylinux: "2014"
            artifact: wheels-linux-aarch64
          - os: windows-latest
            target: x86_64
            manylinux: "off"
            artifact: wheels-windows-x86_64
          - os: macos-latest
            target: universal2-apple-darwin
            manylinux: "off"
            artifact: wheels-macos-universal2

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.11 for the ABI3 build
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Build ABI3 wheel
        uses: PyO3/maturin-action@v1
        with:
          maturin-version: v1.13.3
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --locked --compatibility pypi --out dist

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*.whl
          if-no-files-found: error

  sdist:
    name: Build source distribution
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          maturin-version: v1.13.3
          command: sdist
          args: --out dist

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  wheel-abi-smoke:
    name: Smoke ABI3 wheel on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    needs: wheels
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Retrieve Linux x86_64 wheel
        uses: actions/download-artifact@v4
        with:
          name: wheels-linux-x86_64
          path: dist

      - name: Install the finished wheel
        run: python -m pip install dist/*.whl

      - name: Import and call the native extension
        run: |
          python - <<'PY'
          import arepy.arepy_renderer as native

          try:
              native.configure_render_backend(0)
          except ValueError:
              pass
          else:
              raise AssertionError("native ABI smoke call did not run")
          PY

  pypi-publish:
    name: Publish release to PyPI
    runs-on: ubuntu-latest
    needs: [wheels, wheel-abi-smoke, sdist]
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/project/arepy/

    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: Retrieve source distribution
        uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist

      - name: Publish with PyPI trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1
