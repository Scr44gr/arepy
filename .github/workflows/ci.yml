name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  rust:
    name: Rust quality gates
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5

    - name: Install Rust tooling
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy

    - name: Set up Python 3.11 for PyO3
      uses: actions/setup-python@v6
      with:
        python-version: "3.11"

    - name: Check Rust formatting
      run: cargo fmt --all -- --check

    - name: Check Rust workspace
      run: cargo check --workspace --all-targets --locked

    - name: Lint Rust workspace
      run: cargo clippy --workspace --all-targets --locked -- -D warnings

    - name: Test Rust workspace
      run: cargo test --workspace --all-targets --locked

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v5

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install uv
      uses: astral-sh/setup-uv@v8
      with:
        version: "latest"
    
    - name: Install dependencies
      run: |
        uv sync --locked --no-dev --extra testing

    - name: Compile examples
      run: uv run --no-sync python -m compileall -q examples
    
    - name: Run tests with pytest
      run: |
        uv run --no-sync pytest --cov=arepy --cov-report=xml --cov-report=term
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: true

  docs:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Set up Python 3.12
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"

    - name: Install uv
      uses: astral-sh/setup-uv@v8
      with:
        version: "latest"

    - name: Install docs dependencies
      run: |
        uv sync --locked --no-dev --extra docs

    - name: Build docs with MkDocs
      run: |
        uv run --no-sync mkdocs build --strict
